<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HALO Emulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 10px 20px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }
    h1 { font-size: 14px; color: #58a6ff; letter-spacing: 2px; text-transform: uppercase; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8b949e; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #f85149; flex-shrink: 0; }
    .dot.connected { background: #3fb950; }

    /* ── Metrics bar ── */
    .metrics {
      display: flex;
      gap: 28px;
      padding: 8px 20px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .metric { display: flex; flex-direction: column; gap: 1px; }
    .metric-value { font-size: 20px; color: #58a6ff; font-weight: bold; line-height: 1; }
    .metric-label { font-size: 9px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }

    /* ── Log table wrapper ── */
    .log-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 16px;
    }

    /* ── Table: no borders, alignment only ── */
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    /* Column widths */
    .col-time       { width: 78px; }
    .col-flights    { width: 19%; }
    .col-tasks      { width: 19%; }
    .col-assignments{ width: 19%; }
    .col-crew       { width: 19%; }
    .col-equipment  { width: 19%; }

    /* Sticky header */
    thead tr {
      background: #0d1117;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    thead th {
      padding: 10px 8px 6px;
      text-align: left;
      font-size: 11px;
      font-weight: normal;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .th-time       { color: #3d444d; }
    .th-flights    { color: #58a6ff; }
    .th-tasks      { color: #e3b341; }
    .th-assignments{ color: #39c5cf; }
    .th-crew       { color: #3fb950; }
    .th-equipment  { color: #bc8cff; }

    .th-sub {
      display: block;
      font-size: 9px;
      letter-spacing: 0.5px;
      text-transform: none;
      color: #8b949e;
      margin-top: 1px;
      min-height: 12px;
    }

    /* Body rows */
    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: #161b22; }

    td {
      padding: 2px 8px;
      font-size: 12px;
      vertical-align: top;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .td-time { color: #3d444d; font-size: 10px; padding-top: 3px; }

    /* Per-column message colors */
    .td-flights    { color: #58a6ff; }
    .td-tasks      { color: #e3b341; }
    .td-assignments{ color: #39c5cf; }
    .td-crew       { color: #3fb950; }
    .td-equipment  { color: #bc8cff; }

    .empty-row td {
      padding-top: 24px;
      color: #3d444d;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1>&#9992; HALO Emulator</h1>
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-text">Connecting…</span>
    </div>
  </header>

  <div class="metrics">
    <div class="metric"><span class="metric-value" id="m-flights">—</span><span class="metric-label">Flights</span></div>
    <div class="metric"><span class="metric-value" id="m-tasks">—</span><span class="metric-label">Tasks</span></div>
    <div class="metric"><span class="metric-value" id="m-pending">—</span><span class="metric-label">Pending</span></div>
    <div class="metric"><span class="metric-value" id="m-completed">—</span><span class="metric-label">Completed</span></div>
    <div class="metric"><span class="metric-value" id="m-crew-busy">—</span><span class="metric-label">Crew Busy</span></div>
    <div class="metric"><span class="metric-value" id="m-equip-busy">—</span><span class="metric-label">Equip Busy</span></div>
  </div>

  <div class="log-wrap" id="log-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-time th-time"></th>
          <th class="col-flights th-flights">Flights</th>
          <th class="col-tasks th-tasks">
            Tasks
            <span class="th-sub" id="avg-dispatch"></span>
          </th>
          <th class="col-assignments th-assignments">Assignments</th>
          <th class="col-crew th-crew">Crew</th>
          <th class="col-equipment th-equipment">Equipment</th>
        </tr>
      </thead>
      <tbody id="log-body">
        <tr class="empty-row">
          <td></td>
          <td colspan="5">Waiting for events…</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const MAX_ROWS = 200;
    const host     = window.location.host || 'localhost:8080';
    const apiBase  = `http://${host}`;
    const logBody  = document.getElementById('log-body');
    const logWrap  = document.getElementById('log-wrap');

    // ── WebSocket ──────────────────────────────────────────────
    function connect() {
      const ws = new WebSocket(`ws://${host}/ws`);

      ws.onopen = () => {
        document.getElementById('dot').className = 'dot connected';
        document.getElementById('status-text').textContent = 'Connected';
      };
      ws.onclose = () => {
        document.getElementById('dot').className = 'dot';
        document.getElementById('status-text').textContent = 'Disconnected — retrying…';
        setTimeout(connect, 2000);
      };
      ws.onerror = () => ws.close();
      ws.onmessage = e => appendRow(JSON.parse(e.data));
    }

    // ── Log table ──────────────────────────────────────────────
    const COLS = ['flights', 'tasks', 'assignments', 'crew', 'equipment'];

    function appendRow(event) {
      // Remove placeholder
      const placeholder = logBody.querySelector('.empty-row');
      if (placeholder) placeholder.remove();

      const { col, msg } = categorise(event);
      if (!col) return;

      const now = new Date();
      const ts  = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

      const tr = document.createElement('tr');

      // Time cell
      const tdTime = document.createElement('td');
      tdTime.className = 'td-time';
      tdTime.textContent = ts;
      tr.appendChild(tdTime);

      // Five column cells
      for (const c of COLS) {
        const td = document.createElement('td');
        if (c === col) {
          td.className = `td-${c}`;
          td.textContent = msg;
          td.title = msg; // full text on hover if truncated
        }
        tr.appendChild(td);
      }

      logBody.appendChild(tr);

      // Cap rows
      while (logBody.rows.length > MAX_ROWS) logBody.deleteRow(0);

      // Auto-scroll if near bottom
      const nearBottom = logWrap.scrollHeight - logWrap.scrollTop - logWrap.clientHeight < 60;
      if (nearBottom) logWrap.scrollTop = logWrap.scrollHeight;
    }

    function categorise(event) {
      const p = event.payload || {};
      switch (event.type) {
        case 'flight.arrived':
          return { col: 'flights', msg: `${p.flight_number || '?'} arrived · ${p.gate || '?'}` };
        case 'flight.delayed':
          return { col: 'flights', msg: `${p.flight_number || '?'} delayed` };
        case 'task.created':
          return { col: 'tasks', msg: `${p.type || '?'} created` };
        case 'task.completed':
          return { col: 'tasks', msg: `${p.type || '?'} completed` };
        case 'assignment.created':
          return { col: 'assignments', msg: `dispatched` };
        case 'assignment.completed':
          return { col: 'assignments', msg: `completed` };
        case 'crew.available':
          return { col: 'crew', msg: `${p.name || '?'} available` };
        case 'crew.unavailable':
          return { col: 'crew', msg: `${p.name || '?'} off duty` };
        case 'equipment.available':
          return { col: 'equipment', msg: `${p.type || '?'} ready` };
        case 'equipment.broken':
          return { col: 'equipment', msg: `${p.type || '?'} broken` };
        default:
          return { col: null, msg: '' };
      }
    }

    // ── Metrics polling ────────────────────────────────────────
    async function refreshMetrics() {
      try {
        const res = await fetch(`${apiBase}/metrics`);
        if (!res.ok) return;
        const m = await res.json();
        document.getElementById('m-flights').textContent    = m.total_flights    ?? '—';
        document.getElementById('m-tasks').textContent      = m.total_tasks      ?? '—';
        document.getElementById('m-pending').textContent    = m.pending_tasks    ?? '—';
        document.getElementById('m-completed').textContent  = m.completed_tasks  ?? '—';
        document.getElementById('m-crew-busy').textContent  = m.busy_crew        ?? '—';
        document.getElementById('m-equip-busy').textContent = m.busy_equipment   ?? '—';

        const d = m.avg_dispatch_seconds;
        document.getElementById('avg-dispatch').textContent =
          d != null ? `avg dispatch ${(d * 1000).toFixed(1)}ms` : '';
      } catch (_) {}
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    connect();
    refreshMetrics();
    setInterval(refreshMetrics, 5000);
  </script>
</body>
</html>
